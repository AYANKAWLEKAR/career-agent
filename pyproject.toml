[project]
name = "career-navigator"
version = "0.1.0"
description = "Career Path Navigator: data foundation for an agentic career-planning system on Oracle Autonomous AI Database"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "oracledb>=3.0",
    "oracleagentmemory>=26.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "anthropic>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=navigator --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["navigator"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src/navigator"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
